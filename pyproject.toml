[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-crontab-server"
version = "2.0.0"
description = "MCP server for exploring, explaining, and managing crontab entries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "croniter>=1.0.0",
]

[project.scripts]
mcp-crontab-server = "mcp_crontab_server.server:main"
